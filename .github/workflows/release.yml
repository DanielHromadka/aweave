# Every push to main checks the code, builds aweave for macOS (arm64, x64), Linux (x64, arm64) and Windows (x64),
# and publishes the archives as the latest release of this repository. Asset names carry no version
# (aweave-aarch64-apple-darwin.tar.gz), so the website, install.sh and README can link to
# /releases/latest/download/<name> without anyone editing links. Each archive has a .sha256 next to it.
#
# Version: major.minor from Cargo.toml plus the run number (0.1.42), so every release is higher than the last.
# For a bigger step raise major.minor in Cargo.toml in a normal commit.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - id: version
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -1)
          echo "version=$base.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git log -20 --format='- %s' > notes.md
          gh release view "v$VERSION" > /dev/null 2>&1 ||
            gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "aWeave $VERSION" --notes-file notes.md

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set the version
        run: |
          perl -0pi -e 's/^version = ".*?"/version = "$ENV{VERSION}"/m' Cargo.toml
          grep -m1 '^version' Cargo.toml
      - run: cargo build --release --target "$TARGET"
      - name: Package
        run: |
          mkdir -p pkg
          if [[ "$TARGET" == *windows* ]]; then
            name="aweave-$TARGET.zip"
            cp "target/$TARGET/release/aweave.exe" LICENSE README.md pkg/
            (cd pkg && 7z a -bd "../$name" . > /dev/null)
            sha256sum "$name" > "$name.sha256"
          else
            name="aweave-$TARGET.tar.gz"
            cp "target/$TARGET/release/aweave" LICENSE README.md pkg/
            tar -czf "$name" -C pkg .
            if command -v sha256sum > /dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          fi
          echo "ASSET=$name" >> "$GITHUB_ENV"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
